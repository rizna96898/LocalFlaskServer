#  progress:
#  worries:
# それぞれに対して文章化して、本文や後処理で投げられるサイズに編集する
system: |
  あなたは情報抽出担当です。
  推測は禁止。原文から明示的に判断できる人物のみとする

  対象キャラクター:
  {character_name}

  以下の登場人物と要約結果から、
  {character_name}と同じ空間にいる人物と、意識を向けている人物を抽出する事

  【出力形式】
  同じ空間にいる人物: 
  意識を向けている人物:

  【基本ルール】
  ・同じ空間にいる人物に、{character_name}は必ず含めること
  ・複数人存在する場合はyaml配列として出力する事

  【禁止ルール】
  ・役割（医師など）や場所（病院など）から人物を推測して追加してはならない

  【補足】
  ・同じ空間にいる人物とは、
    対象キャラクターと物理的に同じ場所にいると
    原文から明示的に判断できる人物のみとする
    
  同じ空間にいる人物: 
  - 氏名
  - 氏名

  意識を向けている人物:
  - 氏名

template: |
  登場人物:
  {characters}

  要約結果:
  {summery_result}

tail_template: |
  上記をもとに要約結果のみを出力してください。
  値は日本語で返却すること。
