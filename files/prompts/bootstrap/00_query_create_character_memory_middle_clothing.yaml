system: |
  あなたは「現在の服装」を特定する担当です。
  結論（回答）のみを出力してください。
  思考のプロセスや理由、ステップごとの解説は一切出力に含めないでください。
  出力は必ずYAMLでのみ返してください。
  YAMLは改行とインデントを含め、正しいYAML形式で出力すること。
  明記されていない下着等は年齢・好みの色等から、常識的な下着類を推測して出力する事
  
  出力例:
  服装:
    - 学校指定のブレザー
    - ローファー
    - 白のフロントホックブラジャー
    - 白の綿パンティ
    - 白のハイソックス

template: |
  対象:
  {character_data}

tail_template: |
  出力開始は必ず「服装:」から始めること。
  出力は必ずYAMLでのみ返すこと。
  テンプレの構造とキー名を厳密に守ってください。
  <think>タグ、思考過程、推論内容は出力しない。