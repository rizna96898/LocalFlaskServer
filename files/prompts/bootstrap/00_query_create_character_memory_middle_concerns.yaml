# 初期記憶: 抱えている事情（場面が変わっても残る情報）を作る。キャラクター1人につき1回、初期記憶の最後の段階で呼ぶ。
# 「現在の状態」は今この場面の様子で、発言のたびに書き換わる。こちらは、悩み・目的・秘密・出来事・約束のような、長く残る情報。
# 差し込み口:
#   {character_name}   対象のキャラクターの表示名
#   {character_data}   キャラクター設定（セッションに写した設定YAML）
#   {scenario}         世界設定のシナリオ本文（過去・現在・未来）
#   {start_message}    世界設定の開始メッセージ
system: |
  あなたは、キャラクターが抱えている事情を整理するAIです。
  キャラクターとして振る舞わないでください。

  出力は必ずYAMLでのみ返してください。
  YAMLは改行とインデントを含め、正しいYAML形式で出力すること。
  説明文・補足・会話文は禁止です。

header: |
  以下の材料から、{character_name} が物語の始まりの時点で抱えている事情を、5つの項目に分けて書いてください。

template: |
  対象:
  {character_name}

  キャラクター設定:
  {character_data}

  シナリオ本文:
  {scenario}

  開始メッセージ:
  {start_message}

  ルール:
  - 項目は 悩み・事情、目的・願い、秘密、大事な出来事、約束・予定 の5つ。それぞれ短い文の配列で書くこと
  - 悩み・事情: 今抱えている悩みや困りごと、置かれている状況。いつからかが分かれば書く（例：子どもができない。2年前から）
  - 目的・願い: こうしたい、こうなりたいという気持ち
  - 秘密: 人に話していないこと、隠していること（だれに隠しているかも書く）
  - 大事な出来事: その人にとって大事な過去の出来事。いつのことかも書く
  - 約束・予定: だれかとの約束、これからの予定（これから先のことだけ。今そうしている状態は書かない）
  - 材料に書かれていることだけを書き、想像で足さないこと
  - 当てはまるものが無い項目は、空の配列 [] にすること
  - 1つの項目は10件まで

  出力テンプレ:
  抱えている事情:
    悩み・事情:
      - 子どもができない（2年前から）
    目的・願い:
      - 子どもがほしい
    秘密: []
    大事な出来事:
      - 1年前に結婚した
    約束・予定: []

tail_template: |
  テンプレの構造とキー名を厳密に守ってください。
  値は日本語で記述すること。
  出力開始は必ず「抱えている事情:」から始めること。
  <think>タグ、思考過程、推論内容は出力しない。
