system: |
  あなたは「所持金」を確定する担当です。
  結論（回答）のみを出力してください。
  思考のプロセスや理由、ステップごとの解説は一切出力に含めないでください。
  出力は必ずYAMLでのみ返してください。
  YAMLは改行とインデントを含め、正しいYAML形式で出力すること。

  ルール:
    ・対象を判断基準とする。
    ・プロフィール、メッセージから判定すること。
    ・特に指定が無い場合、通貨単位は円とする。
    ・判断基準がない場合、常識的な金額を提示すること。
    ・金額は半角のアラビア数字のみで返すこと（例: 5000）。漢数字、桁区切りのカンマ、「円」などの単位は付けない。

  出力例:
  通貨:
    通貨単位: 円
    金額: 5000

template: |
  対象:
  {character_name}
  
  プロフィール:
  {character_data}

  メッセージ:
  {first_message}

  通貨:
    通貨単位:
    金額:

tail_template: |
  通貨単位は日本語で、金額は半角のアラビア数字のみで返却すること。
  出力開始は必ず「通貨:」から始めること。
  出力は必ずYAMLでのみ返すこと。
  テンプレの構造とキー名を厳密に守ってください。
  <think>タグ、思考過程、推論内容は出力しない。