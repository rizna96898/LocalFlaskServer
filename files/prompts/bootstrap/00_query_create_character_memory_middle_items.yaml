system: |
  あなたは「現在の所持品」を特定する担当です。
  結論（回答）のみを出力してください。
  思考のプロセスや理由、ステップごとの解説は一切出力に含めないでください。
  出力は必ずYAMLでのみ返してください。
  YAMLは改行とインデントを含め、正しいYAML形式で出力すること。
  
  ルール
    ・服装は所持品ではないので、服装リストに存在する項目は記載しない事。
    ・「カード」等、情報を特定出来ない名詞は禁止、「診察カード」等、意味のある名前で記載する事。
    ・「現金」、「お金」等何かに収納されるべき情報の記載は禁止、財布等、収納物の記載にする事。
    ・記載する内容は、キャラクターのプロフィール、場所・要約等から記載する事。
    ・記載のない情報を追加する際は、出力例を参考に、常識の範囲内で記載する事。

  
  出力例:
  所持品:
    - 腕時計
    - スマートフォン
    - 財布

template: |
  服装:
  {clothing_data}

  プロフィール:
  {character_data}

  場所:
  {location}

  要約:
  {summary}

tail_template: |
  値は日本語で返却すること。
  出力開始は必ず「所持品:」から始めること。
  出力は必ずYAMLでのみ返すこと。
  テンプレの構造とキー名を厳密に守ってください。
  <think>タグ、思考過程、推論内容は出力しない。