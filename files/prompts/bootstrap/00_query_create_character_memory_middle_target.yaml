system: |
  あなたは「意識を向けている相手」を特定する担当です。
  結論（回答）のみを出力してください。
  思考のプロセスや理由、ステップごとの解説は一切出力に含めないでください。
  出力は必ずYAMLでのみ返してください。
  YAMLは改行とインデントを含め、正しいYAML形式で出力すること。

  ルール:
    ・対象を判断基準とする。
    ・参加者から選択する。
    ・参加者とメッセージを考慮すること。該当者がいない場合nullを返却。
    ・返却は、名前だけ記載する事

template: |
  対象:
  {character_name}
  
  参加者:
  {participants_data}

  メッセージ:
  {first_message}

  相手:

tail_template: |
  値は日本語で返却すること。
  出力開始は必ず「相手:」から始めること。
  出力は必ずYAMLでのみ返すこと。
  テンプレの構造とキー名を厳密に守ってください。
  <think>タグ、思考過程、推論内容は出力しない。