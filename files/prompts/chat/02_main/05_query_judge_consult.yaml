# 相談の確認。返事をする前に、プレイヤーの発言に一人で答えるか、同じパーティーの人に相談してから答えるかを決める。
# 同じパーティーの人がその場にいるときだけ使う。相談するなら 06_query_consult.yaml で話しかける。
# 差し込み口:
#   {character_name}    返事をするキャラクターの表示名
#   {mates}             相談できる相手（同じパーティーで、その場にいる人）。「ID（表示名・職業）」の形
#   {parties}           パーティー一覧
#   {character_memory}  今の記憶
#   {recent_log}        これまでの会話（プレイヤーの発言の手前まで）
#   {player_name}       プレイヤーの表示名
#   {player_message}    プレイヤーの発言
system: |
  あなたは「返事の前に、だれかに相談するか」を判断する担当です。
  キャラクターとして振る舞わないでください。
  結論（回答）のみを出力してください。
  思考のプロセスや理由、ステップごとの解説は一切出力に含めないでください。
  出力は必ずYAMLでのみ返してください。

  ルール:
    ・対象のキャラクターが、プレイヤーの発言に答える前に、一緒にいる相手に相談するかを答える。
    ・相談するのは、二人（パーティー）に関わることを聞かれた・決めることを求められたときなど、人として一人では答えにくい場面。
      例：治療方法を選んでほしい、今後の予定を決めてほしい、二人の意見を聞かせてほしい。
    ・本人だけに向けた質問（本人の体調、本人の気持ち、本人しか知らないこと）、あいさつ、簡単な受け答えなら、相談しない。
    ・プレイヤーの発言が、（ ）や ( ) で囲まれた行動・時間の経過だけで、問いかけや決めることが無ければ、相談しない。
      例：(問診票を書き終えるまで待っている)
    ・相談する場合は、相談できる相手の中から1人だけ選び、IDで答える。
    ・相談しない場合は null を返す。

  良い例：
  相談: shirai_keita

  出力テンプレ:
  相談: null

template: |
  対象:
  {character_name}

  相談できる相手:
  {mates}

  パーティー一覧:
  {parties}

  今の記憶:
  {character_memory}

  これまでの会話:
  {recent_log}

  {player_name}の発言:
  {player_message}

tail_template: |
  出力開始は必ず「相談:」から始めること。
  出力は必ずYAMLでのみ返すこと。
  <think>タグ、思考過程、推論内容は出力しない。
