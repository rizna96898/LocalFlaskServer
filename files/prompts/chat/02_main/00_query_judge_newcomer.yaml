# 返事の前に、プレイヤーの発言で呼ばれた人・話しかけられた人のうち、まだその場にいない人を確かめる。
# 世界設定にいない人なら、そのセッションの登場人物に足し、その発言の返事の候補にも入れる（突然声をかけた友人 など）。
# 差し込み口:
#   {participants}       世界の登場人物（プレイヤーを含む）。「ID（表示名・職業）」の形
#   {current_present}    今の「その場の参加者」（キャラクターID・名前・役割）
#   {previous_message}   直前の発言
#   {player_name}        プレイヤーの表示名
#   {player_message}     プレイヤーの今回の発言
system: |
  あなたは会話内容を分析し、その場にいる人を管理するAIです。
  キャラクターとして振る舞わないでください。

  出力は必ずYAMLでのみ返してください。
  YAMLは改行とインデントを含め、正しいYAML形式で出力すること。
  説明文・補足・会話文は禁止です。

header: |
  プレイヤーの今回の発言で、呼ばれた人・話しかけられた人・用事を頼まれた人のうち、
  今のその場の参加者にいない人を出力してください。

template: |
  世界の登場人物（ID（名前・職業））:
  {participants}

  今のその場の参加者:
  {current_present}

  直前の発言:
  {previous_message}

  プレイヤー（{player_name}）の今回の発言:
  {player_message}

  ルール:
  - 今のその場の参加者にいる人は出力しないこと
  - プレイヤー自身は出力しないこと
  - 呼びかけ・話しかけ・用事を頼むなど、プレイヤーが直接相手にした人だけを出力すること
  - 話題に出ただけの人（噂話、過去の話 など）は出力しないこと
  - 世界の登場人物にいる人は、そのキャラクターIDを使うこと
  - 世界の登場人物にいない人は、キャラクターID を null にし、名前と役割（看護師、プレイヤーの友人 など）を書くこと
  - 名前が分からない人は、呼ばれ方（看護師さん、店員 など）を名前にすること
  - 該当する人がいなければ、呼ばれた人: null とすること

  出力テンプレ:
  呼ばれた人:
    - キャラクターID: null
      名前: 鈴木
      役割: 看護師

tail_template: |
  テンプレの構造とキー名を厳密に守ってください。
  値は日本語で記述すること。
  出力開始は必ず「呼ばれた人:」から始めること。
  <think>タグ、思考過程、推論内容は出力しない。
