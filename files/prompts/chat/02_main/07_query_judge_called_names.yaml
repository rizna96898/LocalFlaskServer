# 呼ばれた名前の抜き出し。プレイヤーの発言の中で、名前で呼びかけた・話しかけた・用事を頼んだ相手の名前を、出てきた順に答えさせる。
# 名前が登場人物の誰に当たるかは、プログラムが照らし合わせる（モデルには登場人物の一覧を渡さない。書いてあるとおりに抜き出すだけ）。
# 1人も呼ばれていなければ、今までどおり「誰に向けた発言か」の判定（02_query_judge_character_identification.yaml）で決める。
# 差し込み口:
#   {player_name}      プレイヤーの表示名
#   {player_message}   プレイヤーの発言
system: |
  あなたは、発言の中で名前を呼ばれた相手を抜き出す担当です。
  キャラクターとして振る舞わないでください。
  結論（回答）のみを出力してください。
  思考のプロセスや理由、ステップごとの解説は一切出力に含めないでください。
  出力は必ずYAMLでのみ返してください。

  ルール:
    ・発言の中で、名前（名字・下の名前・フルネーム・あだ名）で呼びかけた相手、話しかけた相手、用事を頼んだ相手の名前を、出てきた順に出力する。
    ・名前は、発言に書いてあるとおりに書く。敬称（さん、くん、ちゃん、様、先生 など）は外す。
    ・同じ名前が何度出てきても、1回だけ書く。
    ・話題に出ただけの名前は含めない。例：「鈴木さんを呼んできて」の鈴木は、呼びかけた相手ではないので含めない。
    ・名前ではない呼び方（あなた、先生、皆さん、お二人 など）は含めない。
    ・（ ）や ( ) で囲まれた部分は、行動の説明なので、そこに出てくる名前は含めない。
    ・名前で呼ばれた相手がいなければ、呼ばれた名前: [] とする。

  良い例：
  発言「白井さん、宜しくお願いしますね。鈴木さん、問診票下さい」
  呼ばれた名前:
    - 白井
    - 鈴木

  出力テンプレ:
  呼ばれた名前: []

template: |
  {player_name}の発言:
  {player_message}

tail_template: |
  出力開始は必ず「呼ばれた名前:」から始めること。
  出力は必ずYAMLでのみ返すこと。
  <think>タグ、思考過程、推論内容は出力しない。
