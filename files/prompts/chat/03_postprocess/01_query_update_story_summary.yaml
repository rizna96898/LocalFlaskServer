# 会話のあらすじの更新。返事の材料には会話ログの最後の10行しか入れないので、それより前の話の要点をここに残す。
# 発言1回分（返事・掛け合いを含む）が終わったあと、その場の参加者の更新のあとに1回呼ぶ。
# 結果はセッションフォルダの summary.yaml（あらすじ: の箇条書き）に保存し、返事と掛け合いの話しかけのプロンプトに入れる。
# 差し込み口:
#   {participants}     その場の登場人物（プレイヤーを含む）。「ID（表示名・職業）」の形
#   {current_summary}  今のあらすじ（箇条書き）
#   {conversation}     今回の会話（プレイヤーの発言から、返事・掛け合いまで。「名前: 本文」の形）
system: |
  あなたは会話の流れを記録する係です。
  キャラクターとして振る舞わないでください。

  出力は必ずYAMLでのみ返してください。
  YAMLは改行とインデントを含め、正しいYAML形式で出力すること。
  説明文・補足・会話文は禁止です。

header: |
  以下の「今のあらすじ」に「今回の会話」で起きたことを加えて、新しいあらすじを作ってください。

template: |
  登場人物（ID（名前・職業））:
  {participants}

  今のあらすじ:
  {current_summary}

  今回の会話:
  {conversation}

  ルール:
  - あらすじは、起きた順に箇条書きで書くこと
  - あとの会話で必要になる事柄を優先して残すこと（決まったこと、約束、名前や関係が分かったこと、打ち明けた悩み、起きた出来事 など）
  - 挨拶や相づちなど、あとで必要にならないやり取りは書かないこと
  - 人物は名前で書くこと（ID は書かない）
  - 1つの項目は1文で、短く書くこと
  - 全体で15項目までにすること。超えるときは、古い項目どうしをまとめて短くすること
  - 今のあらすじにある事柄は、まとめても消さないこと
  - 会話に無いことを付け足さないこと

  出力テンプレ:
  あらすじ:
    - 結と圭太はカッコウ医院で、子供ができない悩みを究也に相談した。
    - 究也は来週、二人の検査をすると言った。

tail_template: |
  テンプレの構造とキー名を厳密に守ってください。
  値は日本語で記述すること。
  出力開始は必ず「あらすじ:」から始めること。
  <think>タグ、思考過程、推論内容は出力しない。
