# 世界の記憶更新。前処理でやるなら不要かもしれないが
# 場から人が消えた場合に必要になるかもしれない
#
# 2026-10-19: 「その場の参加者」の更新に使う形で書き直した。元の中身は files/prompts/backups/旧01_query_update_world_memory.yaml
# 2026-10-21: 全員の一覧ではなく「来た人」「出て行った人」だけを答える形にした（全員を書かせると、会話で話した人以外を落としたため）。
# 発言1回分（返事・掛け合いを含む）が終わったあと、キャラクターの記憶の更新より先に1回呼ぶ。
# 差し込み口:
#   {participants}      世界の登場人物（プレイヤーを含む）。「ID（表示名・職業）」の形
#   {current_present}   今の「その場の参加者」（キャラクターID・名前・役割）
#   {conversation}      今回の会話（プレイヤーの発言から、返事・掛け合いまで。「名前: 本文」の形）
system: |
  あなたは会話内容を分析し、その場にいる人を管理するAIです。
  キャラクターとして振る舞わないでください。

  出力は必ずYAMLでのみ返してください。
  YAMLは改行とインデントを含め、正しいYAML形式で出力すること。
  説明文・補足・会話文は禁止です。

header: |
  以下の「今のその場の参加者」に対して、「今回の会話」で、その場に来た人と、その場から出て行った人を答えてください。

template: |
  世界の登場人物（ID（名前・職業））:
  {participants}

  今のその場の参加者:
  {current_present}

  今回の会話:
  {conversation}

  ルール:
  - 答えるのは、出入りした人だけ。今のその場の参加者を書き写さないこと
  - 今回の会話で話していない人も、出て行ったと分かる発言・行動が無ければ、その場に残っている（出て行った人に書かない）
  - 来た人: 今回の会話で、その場に来た人・呼ばれて現れた人（今のその場の参加者にいない人だけ）
  - 出て行った人: 今回の会話で、その場から出て行った人・別れた人（今のその場の参加者にいる人だけ）
  - 出入りが無ければ、来た人: [] と 出て行った人: [] にすること
  - プレイヤーは書かないこと
  - 世界の登場人物にいる人は、そのキャラクターIDを使うこと
  - 世界の登場人物にいない人が新しく現れたときは、キャラクターID を null にし、名前と役割（プレイヤーの友人 など）を書くこと
  - 名前が分からない人は、呼ばれ方（友人、店員 など）を名前にすること
  - 役割は、その人の立場を短く書くこと

  出力テンプレ:
  来た人:
    - キャラクターID: null
      名前: 田中
      役割: プレイヤーの友人
  出て行った人:
    - キャラクターID: shirai_keita
      名前: 白井 圭太

tail_template: |
  テンプレの構造とキー名を厳密に守ってください。
  値は日本語で記述すること。
  出力開始は必ず「来た人:」から始めること。
  <think>タグ、思考過程、推論内容は出力しない。
