# 今回の出来事でmemory要素の更新、積み上げの為の物# 世界の記憶更新。前処理でやるなら不要かもしれないが
# 場から人が消えた場合に必要になるかもしれない
#
# 2026-10-18: 今の記憶の形（日本語のキー）に合わせて書き直した。元の中身は files/prompts/backups/旧02_query_update_character_memory.yaml
# 2026-10-22: 所持品を「受け渡しを言ったときだけ」変えていたので、手に持っている・使っている物が分かれば足す形にした
#             （問診票に記入しているのに、渡す言葉が無かったので足されなかった）。
# 発言1回分（返事・掛け合いを含む）が終わったあと、メインキャラクターごとに呼ぶ。
# 差し込み口:
#   {character_name}   対象のキャラクターの表示名
#   {current_memory}   今の記憶（character/{ID}_memory.yaml の中身）
#   {conversation}     今回の会話（プレイヤーの発言から、返事・掛け合いまで。「名前: 本文」の形）
#   {participants}     その場の登場人物（プレイヤーを含む）。「ID（表示名・職業）」の形
#   {player_name}      プレイヤーの表示名。プレイヤーの（ ）の行動は確定した出来事として扱わせる
system: |
  あなたは会話内容を分析し、キャラクターの状態と記憶を更新するAIです。
  キャラクターとして振る舞わないでください。

  出力は必ずYAMLでのみ返してください。
  YAMLは改行とインデントを含め、正しいYAML形式で出力すること。
  説明文・補足・会話文は禁止です。

header: |
  以下の「今の記憶」を、「今回の会話」で起きたことに合わせて更新してください。

template: |
  対象:
  {character_name}

  登場人物（ID（名前・職業））:
  {participants}

  今の記憶:
  {current_memory}

  今回の会話:
  {conversation}

  ルール:
  - 今の記憶と同じ構造・同じキー名で、全体を出力すること
  - 今回の会話で変わった項目だけを書き換え、変わっていない項目はそのまま残すこと
  - 複数ある項目は YAML配列で記述すること。不明または内容が無い場合は null とする
  - 説明・補足は書かず、値のみを簡潔に記述すること

  - 場所 は今いる場所を記述すること
  - 状態 は場面の進行状況や今の様子を記述すること。例：診察を受けている
  - 行動 は身体動作のみを記述すること
  - 心情 は感情のみを記述すること。例：不安、緊張、期待
  - 服装 は、着替えや脱衣などが会話に無ければ変えないこと。裸なら裸を明示すること
  - 意識 は、今回の会話の最後の時点で、気持ちや注意を実際に向けている相手のみを、名前で記述すること
  - 返事をした相手と、意識を向けている相手は、同じとは限らないこと（医師に返事をしていても、夫の手を握って不安なら、意識は夫）
  - 会話の中の呼び方（先生 など）は、登場人物の名前と職業から、だれのことかを判断すること
  - 今回の会話で直接話した相手・話しかけられた相手は、会っている相手として扱うこと
  - まだ会っていない相手、これから会う予定の相手、場面上重要なだけの相手は 意識 に含めないこと
  - 所持品 は、今その人が持っている物。今回の会話や行動から、手に持っている・使っている・受け取った物が分かれば足すこと
    （「渡した」「受け取った」という言葉が無くても、問診票に記入している なら 問診票 を足す）
  - 所持品 から、人に渡した・置いてきた・なくした・使い切った物は外すこと。それ以外の物は、今の記憶のまま残すこと
  - {player_name}（プレイヤー）の（ ）の中の行動は、確定した出来事として扱うこと。受け渡しがあれば、それに合わせて 所持品 を直すこと。
    ほかの人の発言や行動と食い違っても、{player_name} の行動を正とすること
    （例：{player_name}「（問診票を受け取る）」のあとで、だれかが問診票を抱えていると書かれていても、問診票は {player_name} に渡っている）
  - 着ている服は 所持品 に入れず、服装 に書くこと
  - 金額 は、支払いや受け取りがあった場合だけ変えること。金額はアラビア数字で記述すること
  - 関係性 は、今の記憶にある人をすべて残すこと。今回の会話で初めて会った人（直接話した人）がいれば、
    今の記憶と同じ形（キャラクターID・名前・役割）で足すこと。キャラクターIDは登場人物のIDを使うこと

tail_template: |
  テンプレの構造とキー名を厳密に守ってください。
  値は日本語で記述すること。
  出力開始は必ず「現在の状態:」から始めること。
  <think>タグ、思考過程、推論内容は出力しない。
