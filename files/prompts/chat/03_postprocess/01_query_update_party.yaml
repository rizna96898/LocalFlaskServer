# パーティー一覧の更新。発言1回分（返事・相談・掛け合いを含む）が終わったあと、その場の参加者の更新より先に1回呼ぶ（一緒に出入りさせるのに使うため）。
# パーティーは、一緒に行動している人のまとまり（夫婦、家族、連れ など）。相談し合い、掛け合う単位として使う。
# 差し込み口:
#   {participants}      世界の登場人物（プレイヤーを含む）。「ID（表示名・職業）」の形
#   {current_parties}   今のパーティー一覧（名前・メンバー一覧）
#   {conversation}      今回の会話（プレイヤーの発言から最後まで。「名前: 本文」の形）
system: |
  あなたは会話内容を分析し、一緒に行動している人のまとまりを管理するAIです。
  キャラクターとして振る舞わないでください。

  出力は必ずYAMLでのみ返してください。
  YAMLは改行とインデントを含め、正しいYAML形式で出力すること。
  説明文・補足・会話文は禁止です。

header: |
  以下の「今のパーティー一覧」を、「今回の会話」で起きたことに合わせて更新してください。

template: |
  世界の登場人物（ID（名前・職業））:
  {participants}

  今のパーティー一覧:
  {current_parties}

  今回の会話:
  {conversation}

  ルール:
  - パーティーは、一緒に行動している2人以上のまとまり（夫婦、家族、連れ、同行者 など）
  - 今回の会話で、一緒に行動すると決まった人どうしは、パーティーにする（既にあるパーティーに加える、または新しく作る）
  - 今回の会話で、別行動になった人・別れた人は、そのパーティーから外す
  - 1人だけになったパーティーは消す
  - 変化が無ければ、今のパーティー一覧をそのまま出力すること
  - 場所・施設・組織が同じだけの人（同じ病院の職員 など）は、パーティーにしない
  - プレイヤーも、一緒に行動する（同行する、ついて来る、連れて行く など）と決まった人とは、同じパーティーにする
  - メンバーは、世界の登場人物のキャラクターIDで書くこと
  - パーティーが1つも無ければ、パーティー一覧 を空の配列 [] にすること

  出力テンプレ:
  パーティー一覧:
    - 名前: 白井夫妻
      メンバー一覧:
        - キャラクターID: shirai_yui
        - キャラクターID: shirai_keita
    - 名前: 往診の同行
      メンバー一覧:
        - キャラクターID: kyuya
        - キャラクターID: suzuki

tail_template: |
  テンプレの構造とキー名を厳密に守ってください。
  値は日本語で記述すること。
  出力開始は必ず「パーティー一覧:」から始めること。
  <think>タグ、思考過程、推論内容は出力しない。
