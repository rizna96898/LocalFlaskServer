# files/settings/system_settings.yaml
port: 5000
default_model: "deepseek/deepseek-v3.2"          # または使いたいモデル名
temperature: 0.85
 
max_tokens: 2048

# OpenRouter設定
# openrouter_api_key は、このファイルではなく secrets.yaml に書く（このファイルは Git で管理するため）

open_router_use_flag: False
openrouter_site_url: "http://127.0.0.1:5000"
# openrouter_site_name: "mythomax-12-13B RP Backend"
openrouter_site_name: "Qwen3.6 35B-A3B RP Backend"
openrouter_max_tokens :
  chat : 2048

local_model_use_flag: True
#local_model_path: "E:\\LocalFlaskServer\\models\\mythomax\\"
local_model_path: "E:\\LocalFlaskServer\\models\\qween\\"
#local_mode_name: "mythomax-l2-13b.Q5_K_M.gguf"
local_model_name: "Qwen3.6-35B-A3B-UD-Q3_K_XL.gguf"
# 一度に扱える文章の長さ（送る内容と返事の合計。トークン数）。モデルを読み込むときに使う。未設定なら 4096
# 大きくすると長い会話や記憶を送れるが、VRAM を多く使う。変えたら「モデルロード」かモデルサーバーの再起動で反映
local_model_n_ctx: 8192
# 作業用領域（KV キャッシュ。n_ctx の分の会話を覚えておく所）の形式。未設定なら f16
#   f16 : そのまま / q8_0 : 大きさが半分（質はほとんど落ちない）/ q4_0 : 4分の1（質が落ちやすい）
# f16 以外にすると、flash attention も自動で有効になる。変えたら「モデルロード」かモデルサーバーの再起動で反映
local_model_kv_cache_type: q8_0
# flash attention を使うか。計算用の領域も小さくなる。未設定なら false（kv_cache_type が f16 以外なら、この値に関係なく使う）
local_model_flash_attn: true
# 窓の分だけ覚える層（SWA。Gemma など）にも、n_ctx の分の作業用領域を取るか。未設定なら false（取らない）
# llama.cpp の既定は true だが、取ると Gemma 4 31B は 8192 で VRAM に載らない。Qwen など SWA を使わないモデルには関係ない
local_model_swa_full: false
# ローカルモデルへ送る会話の形式。未設定なら auto
#   auto : 読み込んだモデルに入っている形式から決める / chatml : Qwen 系など / gemma4 : Gemma 4 / alpaca : mythomax など
local_model_prompt_format: auto

# その他の設定（後で追加しやすい）
log_level: "INFO"
enable_image_generation: true

# キャラクターカードの場所（Silly Tavernのpngカードが入っているフォルダ）
characters_dir: "E:/SillyTavernInstaller/SillyTavern-Launcher/SillyTavern/data/default-user/characters"