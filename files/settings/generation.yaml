# モデルに文章を作らせるときの設定（温度、最大トークン数など）。
#
# ・default が基本の値。用途ごとの欄には「変えたい項目だけ」を書く。
# ・書き換えたら、次にモデルへ送るときから反映される（サーバーの再起動は不要）。
# ・特定のプロンプトだけ変えたいときは、そのプロンプトのYAML（files/prompts/ 以下）に
#   params: の欄を足して、変えたい項目だけ書く。そちらが優先される。
#     例）
#       params:
#         temperature: 0.2
#
# 項目の意味:
#   temperature     ばらつき。小さいほど毎回同じ答えになり、大きいほど多彩になる
#   top_p           候補を、確率の上位から合計がこの割合になるまでに絞る
#   top_k           候補を、確率の上位この個数に絞る。0 は絞らない
#   repeat_penalty  同じ言葉の繰り返しを抑える強さ。1.0 は抑えない
#   max_tokens      1回の返事の長さの上限（トークン数）
#
# このファイルは Git で管理する。APIキーなど秘密の値は書かないこと（それは secrets.yaml に書く）。

default:
  temperature: 0.5
  top_p: 0.9
  top_k: 0
  repeat_penalty: 1.1
  max_tokens: 800

# 記憶の生成（世界の記憶、キャラクターの記憶の各段階）
memory:
  max_tokens: 1500

# 判定（誰の発言か、誰に向けた発言か）
judge:
  max_tokens: 200
  temperature: 0.1   # 答えを1つに決めるだけなので、ぶれを小さくする

# キャラクターの返答
chat:
  max_tokens: 400
